name: Dentascan Android Appium E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Build Web & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Debug Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Appium Tests inside Android Emulator Container
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: bash scripts/ci_run_android_tests.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-appium-reports
          path: |
            android-appium-report.xlsx
            android-execution-report.html
