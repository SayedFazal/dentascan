name: Dentascan API Load Testing (k6)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Start Backend Server
        run: |
          npm run build
          node dist/server.cjs &
          sleep 4
          curl -s --head http://127.0.0.1:3000/ | head -n 1
          echo "BACKEND_URL=http://127.0.0.1:3000" >> $GITHUB_ENV

      - name: Execute k6 API Load Test (100 VUs for 1 Minute)
        run: k6 run --summary-export=summary.json scripts/load-test.js

      - name: Parse k6 Summary & Publish Performance Executive Table
        if: always()
        run: node scripts/parseK6Summary.js
